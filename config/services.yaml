services:
    _defaults:
        autowire: true
        autoconfigure: true
    monolog.logger.reservation:
        class: Psr\Log\LoggerInterface
        arguments: ['@monolog.logger']
        tags:
            - { name: 'monolog.logger', channel: 'reservation' }
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    App\Repository\ReservationExcursionRepository:
        autowire: true
        autoconfigure: true
        public: true

    App\Service\PaymeeService:
        arguments:
            $apiKey: '%env(PAYMEE_API_KEY)%'
            $apiUrl: '%env(PAYMEE_API_URL)%'
            $sandboxMode: '%env(bool:PAYMEE_SANDBOX_MODE)%'

    App\Service\PayPalClient:
        arguments:
            $clientId: '%env(PAYPAL_CLIENT_ID)%'
            $clientSecret: '%env(PAYPAL_CLIENT_SECRET)%'

    App\Form\PostType:
        arguments:
            $repo: '@App\Repository\PackvoyageRepository'
            

    App\Service\RecaptchaService:
        arguments:
            $secretKey: '%recaptcha_secret_key%'

    App\Service\MyStripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
    App\Service\QrCodeGenerator: ~

    App\Service\TwilioService:
        arguments:
            $accountSid: '%twilio.account_sid%'
            $authToken: '%twilio.auth_token%'
            $fromNumber: '%twilio.whatsapp_from%'

    App\Service\UnsplashService:
        arguments:
            $unsplashApiKey: '%unsplash.api_key%'  

  
    App\Service\InfobipService:
        arguments:
            $infobipApiKey: '%env(INFOBIP_API_KEY)%'
    App\Service\PostmarkService:
        arguments:
            $postmarkToken: '%postmark_api_token%'
            $senderEmail: '%postmark_sender_email%'
    App\Service\BrevoEmailService: 
          arguments:
            $apiKey: '%env(BREVO_API_KEY)%'
            $defaultFrom: '%env(BREVO_DEFAULT_FROM)%'
            $logger: '@logger'

  

    
    App\Service\IdentityVerificationService:
        arguments:
            $facePlusPlusApiKey: '%env(FACE_PLUS_PLUS_API_KEY)%'
            $facePlusPlusApiSecret: '%env(FACE_PLUS_PLUS_API_SECRET)%'
    App\Service\FaceVerificationService:
        arguments:
            $apiKey: '%faceplusplus_api_key%'
            $apiSecret: '%faceplusplus_api_secret%'
    App\Service\PredictHQService:
        arguments:
            $predictHQAccessToken: '%predicthq.access_token%'

   
    App\Service\PdfService: ~
   